<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Full Body Health Guide</title>
</head>
<body>
<script>
(async () => {
  const sourceUrl = 'https://cdn.jsdelivr.net/gh/viniciusacmauro/Health@3e1ce33164cb35c278705c48962ccc7d7399c5b9/index.html';
  const oldExercise = '<li class="exercise-item"><strong>Prone Y Raise — 2 × 10–15</strong><span>Lower trapezius — the direct counter to rounded shoulders. Face down, thumbs up.</span> <a href="https://www.youtube.com/results?search_query=prone+y+raise+exercise+how+to" target="_blank" rel="noopener noreferrer">How-to video</a></li>';
  const newExercise = '<li class="exercise-item"><strong>Scapular Push-Up / Push-Up Plus — 2 × 10–15</strong><span>Serratus and scapular-control work without the neck-painful prone Y position.</span> <a href="https://www.youtube.com/results?search_query=scapular+push+up+push+up+plus+how+to" target="_blank" rel="noopener noreferrer">How-to video</a></li>';

  try {
    const response = await fetch(sourceUrl, { cache: "no-store" });
    if (!response.ok) {
      throw new Error(`Unable to load guide (${response.status})`);
    }

    const original = await response.text();
    const occurrences = original.split(oldExercise).length - 1;

    if (occurrences !== 1) {
      throw new Error(`Expected one Prone Y Raise block; found ${occurrences}`);
    }

    const updated = original.replace(oldExercise, newExercise);
    document.open();
    document.write(updated);
    document.close();
  } catch (error) {
    document.body.innerHTML =
      '<main style="font-family:system-ui;padding:24px;max-width:720px;margin:auto">' +
      '<h1>Guide could not load</h1><p>' +
      String(error.message) +
      '</p></main>';
  }
})();
</script>
</body>
</html>
